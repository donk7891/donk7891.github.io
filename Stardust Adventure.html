<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星尘冒险</title>
    <style>
        :root {
            --bg-dark: #0a0a1a;
            --text-light: #e0e0e0;
            --accent-gold: #ffd700;
            --accent-cyan: #00e5ff;
            --accent-red: #ff4757;
            --accent-green: #2ed573;
            --panel-bg: rgba(20, 20, 40, 0.9);
            --border-color: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(30, 30, 80, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(30, 30, 80, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 20%, rgba(40, 40, 100, 0.3) 0%, transparent 50%);
        }

        #game-container {
            position: relative;
            width: 960px;
            max-width: 98vw;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(0, 0, 0, 0.7),
                0 0 120px rgba(80, 60, 200, 0.15),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color);
            background: #000;
            aspect-ratio: 16/9;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 12px 20px;
            pointer-events: none;
            z-index: 10;
        }

        .touch-btn {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.15s;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .touch-left,
        .touch-right {
            display: flex;
            gap: 10px;
        }

        .touch-jump {
            background: rgba(255, 215, 0, 0.25);
            border-color: rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 768px) {
            #game-container {
                border-radius: 0;
                max-width: 100vw;
                aspect-ratio: auto;
                height: 100vh;
            }
            #touch-controls {
                display: flex;
            }
        }

        @media (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="touch-controls">
            <div class="touch-left">
                <button class="touch-btn" id="btn-left">◀</button>
                <button class="touch-btn" id="btn-right">▶</button>
            </div>
            <div class="touch-right">
                <button class="touch-btn touch-jump" id="btn-jump">▲</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 画布设置 ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const GAME_WIDTH = 960;
            const GAME_HEIGHT = 540;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;

            // ==================== 常量 ====================
            const TILE_SIZE = 40;
            const GRAVITY = 0.55;
            const MAX_FALL_SPEED = 14;
            const PLAYER_SPEED = 4.8;
            const PLAYER_ACCEL = 0.35;
            const PLAYER_FRICTION = 0.78;
            const JUMP_FORCE = -11.5;
            const DOUBLE_JUMP_FORCE = -9.5;
            const COYOTE_TIME = 8;
            const JUMP_BUFFER = 6;

            // ==================== 游戏状态 ====================
            const GameState = {
                MENU: 'menu',
                PLAYING: 'playing',
                PAUSED: 'paused',
                GAME_OVER: 'game_over',
                VICTORY: 'victory',
                LEVEL_TRANSITION: 'level_transition',
            };

            let gameState = GameState.MENU;
            let currentLevel = 0;
            let score = 0;
            let lives = 3;
            let totalCoins = 0;
            let collectedCoinsInLevel = 0;
            let transitionTimer = 0;
            let menuSelection = 0;
            let particles = [];
            let floatingTexts = [];
            let screenShake = 0;
            let gameTime = 0;
            let starField = [];
            let audioCtx = null;
            let soundEnabled = true;
            // 作弊系统
            const KONAMI_CODE = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
            let konamiInput = [];
            let cheatInvincible = false;

            // ==================== 输入系统 ====================
            const keys = {};
            const touchState = { left: false, right: false, jump: false };
            let jumpPressed = false;
            let jumpBuffered = 0;
            let coyoteTimer = 0;
            let canDoubleJump = false;

            // ==================== 相机 ====================
            const camera = {
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                shakeX: 0,
                shakeY: 0,
            };

            // ==================== 粒子系统 ====================
            class Particle {
                constructor(x, y, vx, vy, size, color, life, gravity = 0, shrink = true) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.size = size;
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.gravity = gravity;
                    this.shrink = shrink;
                    this.alpha = 1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.life--;
                    this.alpha = this.life / this.maxLife;
                    if (this.shrink) {
                        this.size *= 0.97;
                    }
                    return this.life > 0 && this.alpha > 0.01;
                }

                draw(ctx) {
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            function spawnParticles(x, y, count, color, speed, size, life, gravity = 0) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const vel = Math.random() * speed;
                    particles.push(new Particle(
                        x + (Math.random() - 0.5) * 10,
                        y + (Math.random() - 0.5) * 10,
                        Math.cos(angle) * vel,
                        Math.sin(angle) * vel - speed * 0.3,
                        Math.random() * size + size * 0.3,
                        color,
                        Math.floor(Math.random() * life) + life * 0.5,
                        gravity
                    ));
                }
            }

            function spawnCoinParticles(x, y) {
                const colors = ['#ffd700', '#ffec8b', '#ffb90f', '#fff8dc', '#ffd700'];
                for (let i = 0; i < 18; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const vel = Math.random() * 4 + 1.5;
                    particles.push(new Particle(
                        x, y,
                        Math.cos(angle) * vel,
                        Math.sin(angle) * vel - 3,
                        Math.random() * 4 + 2,
                        colors[Math.floor(Math.random() * colors.length)],
                        Math.floor(Math.random() * 20) + 15,
                        0.12
                    ));
                }
            }

            function spawnDustParticles(x, y, count = 6) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(
                        x + (Math.random() - 0.5) * 12,
                        y,
                        (Math.random() - 0.5) * 2.5,
                        -Math.random() * 1.8 - 0.3,
                        Math.random() * 3.5 + 1.5,
                        'rgba(180, 170, 150, 0.8)',
                        Math.floor(Math.random() * 12) + 8,
                        -0.02
                    ));
                }
            }

            // ==================== 浮动文字 ====================
            class FloatingText {
                constructor(x, y, text, color, size = 18) {
                    this.x = x;
                    this.y = y;
                    this.text = text;
                    this.color = color;
                    this.size = size;
                    this.life = 50;
                    this.maxLife = 50;
                    this.vy = -2.2;
                }

                update() {
                    this.y += this.vy;
                    this.vy *= 0.95;
                    this.life--;
                    return this.life > 0;
                }

                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.font = `bold ${this.size}px 'Segoe UI', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 5;
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            function addFloatingText(x, y, text, color, size = 18) {
                floatingTexts.push(new FloatingText(x, y, text, color, size));
            }

            // ==================== 星空背景 ====================
            function initStarField() {
                starField = [];
                for (let i = 0; i < 200; i++) {
                    starField.push({
                        x: Math.random() * GAME_WIDTH,
                        y: Math.random() * GAME_HEIGHT,
                        size: Math.random() * 2.5 + 0.5,
                        speed: Math.random() * 0.3 + 0.05,
                        brightness: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.03 + 0.01,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }

            // ==================== 音效系统 ====================
            function initAudio() {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    audioCtx = null;
                    soundEnabled = false;
                }
            }

            function playSound(type) {
                if (!soundEnabled || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;

                    switch (type) {
                        case 'jump':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(280, now);
                            osc.frequency.exponentialRampToValueAtTime(520, now + 0.12);
                            gain.gain.setValueAtTime(0.12, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                            osc.start(now);
                            osc.stop(now + 0.15);
                            break;
                        case 'doubleJump':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(380, now);
                            osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                            gain.gain.setValueAtTime(0.13, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                            osc.start(now);
                            osc.stop(now + 0.15);
                            break;
                        case 'coin':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(880, now);
                            osc.frequency.setValueAtTime(1100, now + 0.06);
                            gain.gain.setValueAtTime(0.1, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                            osc.start(now);
                            osc.stop(now + 0.18);
                            break;
                        case 'gem':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(660, now);
                            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.2);
                            gain.gain.setValueAtTime(0.12, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                            osc.start(now);
                            osc.stop(now + 0.25);
                            break;
                        case 'hurt':
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(200, now);
                            osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                            gain.gain.setValueAtTime(0.15, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                            osc.start(now);
                            osc.stop(now + 0.3);
                            break;
                        case 'enemyDefeat':
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(180, now);
                            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                            gain.gain.setValueAtTime(0.1, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                            osc.start(now);
                            osc.stop(now + 0.15);
                            break;
                        case 'checkpoint':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(520, now);
                            osc.frequency.setValueAtTime(660, now + 0.1);
                            osc.frequency.setValueAtTime(780, now + 0.2);
                            gain.gain.setValueAtTime(0.11, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                            osc.start(now);
                            osc.stop(now + 0.3);
                            break;
                        case 'victory':
                            const notes = [523, 659, 784, 1047];
                            notes.forEach((freq, i) => {
                                const o2 = audioCtx.createOscillator();
                                const g2 = audioCtx.createGain();
                                o2.connect(g2);
                                g2.connect(audioCtx.destination);
                                o2.type = 'sine';
                                o2.frequency.setValueAtTime(freq, now + i * 0.12);
                                g2.gain.setValueAtTime(0.1, now + i * 0.12);
                                g2.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                                o2.start(now + i * 0.12);
                                o2.stop(now + i * 0.12 + 0.3);
                            });
                            break;
                        case 'gameOver':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(400, now);
                            osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                            gain.gain.setValueAtTime(0.14, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                            osc.start(now);
                            osc.stop(now + 0.5);
                            break;
                        case 'shoot':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(600, now);
                            osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                            gain.gain.setValueAtTime(0.08, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            osc.start(now);
                            osc.stop(now + 0.1);
                            break;
                        case 'platform':
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(200, now);
                            osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                            gain.gain.setValueAtTime(0.06, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            osc.start(now);
                            osc.stop(now + 0.1);
                            break;
                    }
                } catch (e) {
                    // 静默处理音频错误
                }
            }
